<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>task-hub</title>
    <script>
      // spa-github-pages 方案：把 /vue-taskHub/foo/bar 改写成
      // /vue-taskHub/?/foo/bar，重定向到 index.html，再由 index 还原
      (function () {
        var segmentCount = 1; // 路径中要保留的前置段数：vue-taskHub = 1
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
