<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vue-taskHub/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task-hub</title>
    <script>
      // spa-github-pages 配对脚本：把 404.html 写进 URL 的 ?/foo/bar
      // 还原成真实路径，让 Vue Router 接管
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/vue-taskHub/assets/index-CIZ_EY7Q.js"></script>
    <link rel="stylesheet" crossorigin href="/vue-taskHub/assets/index-C6N-WcRB.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
